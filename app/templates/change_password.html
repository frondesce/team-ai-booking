{% extends "base.html" %}

{% block title %}修改密码 - 团队 AI 预约平台{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 2rem auto;">
    <div class="card">
        <h2 class="card-title">修改密码</h2>
        {% if current_user.must_change_password %}
        <div class="alert alert-warning">
            您当前使用的是初始密码或管理员重置密码，必须修改密码后才能继续使用系统。
        </div>
        {% endif %}
        <form action="/app/change-password" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="old_password">当前密码</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" required minlength="4">
            </div>
            <div class="form-group">
                <label for="confirm_password">确认新密码</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">提交修改</button>
        </form>
    </div>
</div>
{% endblock %}
