{% extends "base.html" %}

{% block title %}登录 - 团队 AI 预约平台{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 3rem auto;">
    <div class="card">
        <h2 class="card-title" style="text-align: center; display: block; margin-bottom: 1.5rem;">成员登录</h2>
        <form action="/app/login" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">登录</button>
        </form>
    </div>
</div>
{% endblock %}
